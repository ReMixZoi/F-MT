<!DOCTYPE html>
<html lang="th">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ทะเบียนแบบฟอร์มแผนกซ่อมบำรุง</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Sarabun:wght@300;400;500;600;700&family=Inter:wght@400;600;700&display=swap"
        rel="stylesheet">
    <style>
        :root {
            --primary: #2563eb;
            --primary-dark: #1e40af;
            --secondary: #475569;
            --success: #059669;
            --danger: #dc2626;
            --warning: #d97706;
            --bg-site: #f8fafc;
            --bg-card: #ffffff;
            --text-main: #0f172a;
            --text-sub: #ffffff;
            --border: #cbd5e1;
            --sidebar-width: 280px;
            --font-main: 'Sarabun', 'Inter', sans-serif;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: var(--font-main);
        }

        body {
            background-color: var(--bg-site);
            padding: 20px 20px 20px calc(var(--sidebar-width) + 20px);
            color: var(--text-main);
        }

        /* Sidebar Styling */
        .history-sidebar {
            position: fixed;
            left: 0;
            top: 0;
            bottom: 0;
            width: var(--sidebar-width);
            background: #ffffff;
            border-right: 1px solid var(--border);
            display: flex;
            flex-direction: column;
            z-index: 1000;
            box-shadow: 4px 0 15px rgba(0, 0, 0, 0.03);
        }

        .sidebar-header {
            padding: 24px;
            border-bottom: 2px solid var(--primary);
            background: #fff;
        }

        .sidebar-title {
            font-weight: 700;
            font-size: 1.1rem;
            color: var(--text-main);
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .sidebar-content {
            flex-grow: 1;
            overflow-y: auto;
            padding: 16px;
        }

        .history-item {
            background: #fff;
            padding: 12px 12px 12px 45px;
            border: 1px solid var(--border);
            border-radius: 12px;
            margin-bottom: 12px;
            cursor: pointer;
            transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
            position: relative;
            user-select: none;
        }

        .history-item:hover {
            border-color: var(--primary);
            box-shadow: 0 8px 16px rgb(255, 255, 255);
            transform: translateX(4px);
        }

        .history-item.selected {
            border-color: var(--primary);
            background: #f5f3ff;
        }

        .item-checkbox {
            position: absolute;
            left: 15px;
            top: 50%;
            transform: translateY(-50%);
            width: 18px;
            height: 18px;
            cursor: pointer;
            accent-color: var(--primary);
        }

        .history-item .date {
            font-weight: 700;
            font-size: 0.95rem;
            margin-bottom: 4px;
            color: var(--text-main);
        }

        .history-item .timestamp {
            font-size: 0.75rem;
            color: var(--text-sub);
        }

        .delete-btn {
            position: absolute;
            bottom: 10px;
            right: 12px;
            color: var(--danger);
            border: none;
            background: none;
            cursor: pointer;
            font-size: 1rem;
            opacity: 0;
            transition: opacity 0.2s;
            padding: 4px;
            border-radius: 4px;
        }

        .history-item:hover .delete-btn {
            opacity: 0.6;
        }

        .delete-btn:hover {
            opacity: 1 !important;
            background: #fee2e2;
        }

        .edit-btn {
            position: absolute;
            bottom: 10px;
            right: 40px;
            color: var(--secondary);
            border: none;
            background: none;
            cursor: pointer;
            font-size: 1rem;
            opacity: 0;
            transition: opacity 0.2s;
            padding: 4px;
            border-radius: 4px;
        }

        .history-item:hover .edit-btn {
            opacity: 0.6;
        }

        .edit-btn:hover {
            opacity: 1 !important;
            background: #e0f2fe;
            color: var(--primary);
        }

        .sidebar-actions {
            padding: 10px 16px;
            border-bottom: 1px solid var(--border);
            background: #fafafa;
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 0.8rem;
            color: var(--text-sub);
        }

        #print-area {
            display: none;
        }

        @media print {
            @page {
                size: landscape;
                margin: 0;
            }

            #print-area {
                display: block !important;
                position: absolute;
                top: 0;
                left: 0;
                width: 100%;
            }
        }


        /* Sheet Container Styling */
        .sheet-container {
            width: 297mm;
            min-height: 209mm;
            background: var(--bg-card);
            margin: 0 auto 30px auto;
            padding: 10mm;
            border-radius: 8px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.08);
            position: relative;
            border: 1px solid var(--border);
            overflow: hidden;
        }

        .form-header {
            display: flex;
            border: 1px solid #000;
            background: #fff;
            align-items: stretch;
        }

        .logo-box {
            width: 250px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            border-right: 1px solid #000;
            padding: 5px 10px;
        }

        .company-name {
            font-weight: 800;
            font-size: 1rem;
        }

        .form-title {
            padding: 10px;
            text-align: center;
        }

        .form-meta {
            width: 220px;
            font-size: 0.75rem;
            padding: 8px;
            background: #f8fafc;
            display: flex;
            flex-direction: column;
            justify-content: center;
            line-height: 1.5;
        }

        .main-table {
            width: 100%;
            border-collapse: collapse;
            font-size: 0.8rem;
            margin-top: 10px;
        }

        .main-table th,
        .main-table td {
            border: 1px solid #000;
            padding: 2px 4px;
            line-height: 1.1;
        }

        .main-table th {
            background: #f1f5f9;
            font-weight: 700;
        }

        .category-cell {
            background: #fff;
            font-weight: 700;
            color: #000;
            text-align: center;
            width: 35px;
            padding: 0 !important;
        }

        .vertical-text {
            writing-mode: vertical-rl;
            transform: rotate(180deg);
            padding: 10px 5px;
            display: inline-block;
            font-size: 0.7rem;
        }

        .col-item {
            width: 180px;
        }

        .col-std {
            width: 180px;
        }

        .check-cell {
            text-align: center;
            cursor: pointer;
            font-weight: 800;
            width: 28px;
            transition: background 0.1s;
        }

        .check-cell:hover {
            background: #f1f5f9 !important;
        }

        .status-ok {
            color: var(--success);
        }

        .status-bad {
            color: var(--danger);
            background: #fef2f2 !important;
        }

        .status-na {
            color: #94a3b8;
        }

        .footer-section {
            margin-top: 15px;
            border: 1px solid #000;
            padding: 10px;
            background: #fff;
        }

        .signature-table {
            width: 100%;
            border-collapse: collapse;
            font-size: 0.75rem;
        }

        .signature-table td {
            border: 1px solid #000;
            text-align: center;
            padding: 5px;
            height: 40px;
        }

        .date-input {
            border: 1px dashed #cbd5e1;
            background: #fff;
            font-size: 0.75rem;
            color: var(--text-main);
            outline: none;
            width: auto;
            text-align: center;
            cursor: pointer;
            padding: 2px 5px;
            border-radius: 4px;
        }

        /* Controls */
        .controls {
            position: fixed;
            top: 20px;
            right: 20px;
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            padding: 20px 20px 45px 20px;
            /* เพิ่ม padding ด้านล่างเผื่อที่ให้แถบเลื่อน */
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.15);
            border-radius: 16px;
            z-index: 1000;
            width: 220px;
            border: 1px solid white;
            user-select: none;
        }

        .drag-handle-bar {
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            height: 36px;
            background: #f8fafc;
            border-top: 1px solid #e2e8f0;
            border-radius: 0 0 16px 16px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #94a3b8;
            cursor: move;
            font-size: 24px;
            line-height: 0;
            padding-bottom: 6px;
            /* ดันจุดขึ้นมาหน่อย */
            transition: all 0.2s;
            letter-spacing: 6px;
        }

        .drag-handle-bar:hover {
            background: #f1f5f9;
            color: var(--primary);
        }

        .drag-handle-bar {
            position: absolute;
            /* Use absolute positioning for perfect bottom alignment */
            bottom: 0;
            left: 0;
            right: 0;
            width: 100%;
            height: 24px;
            background: #e2e8f0;
            cursor: move;
            font-size: 1.5rem;
            /* Improved dot size */
            letter-spacing: 4px;
            /* Improved dot spacing */
            color: #94a3b8;
            /* Dot color */
            display: flex;
            align-items: center;
            justify-content: center;
            border-top: 1px solid #e2e8f0;
            border-radius: 0 0 16px 16px;
            line-height: 0;
            padding-bottom: 4px;
            /* Adjust vertical alignment of dots */
        }

        .controls button,
        .controls input {
            cursor: pointer;
        }

        .btn {
            width: 100%;
            padding: 10px;
            border: none;
            border-radius: 8px;
            font-weight: 700;
            font-size: 0.85rem;
            cursor: pointer;
            transition: all 0.2s;
            margin-bottom: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        .btn-primary {
            background: var(--primary);
            color: white;
        }

        .btn-primary:hover {
            background: var(--primary-dark);
            transform: translateY(-2px);
        }

        .btn-success {
            background: var(--success);
            color: white;
        }

        .btn-success:hover {
            opacity: 0.9;
            transform: translateY(-2px);
        }

        .btn-danger {
            background: var(--danger);
            color: white;
        }

        .btn-danger:hover {
            opacity: 0.9;
            transform: translateY(-2px);
        }

        .btn-outline {
            background: white;
            border: 1.5px solid var(--border);
            color: var(--text-main);
        }

        .btn-outline:hover {
            background: #f8fafc;
            border-color: var(--primary);
            color: var(--primary);
        }

        /* Modal */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(15, 23, 42, 0.7);
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 2000;
            backdrop-filter: blur(4px);
        }

        .custom-modal {
            background: white;
            padding: 24px;
            border-radius: 20px;
            width: 400px;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.25);
        }

        @media print {
            body {
                padding: 0 !important;
                background: white;
            }

            .history-sidebar,
            .controls,
            .modal-overlay,
            .no-print {
                display: none !important;
            }

            .sheet-container {
                border: none !important;
                box-shadow: none !important;
                padding: 5mm !important;
                margin: 0 !important;
                width: 297mm !important;
                height: 209mm !important;
                page-break-after: always;
                overflow: hidden;
            }

            .main-table {
                font-size: 0.65rem !important;
            }

            .main-table th,
            .main-table td {
                padding: 1px 2px !important;
            }

            .date-input {
                border: none;
                padding: 0;
                -webkit-appearance: none;
                -moz-appearance: none;
                appearance: none;
            }

            .date-input::-webkit-calendar-picker-indicator {
                display: none;
            }

            .vertical-text {
                font-size: 0.6rem !important;
                padding: 2px !important;
            }
        }
    </style>

</head>

<body>
    <div id="saveModal" class="modal-overlay">
        <div class="custom-modal">
            <h3 style="margin-bottom: 15px;">💾 บันทึกข้อมูล</h3>
            <p style="font-size: 0.9rem; color: #6b7280; margin-bottom: 10px;">ระบุชื่องานที่ต้องการบันทึก:</p>
            <input type="text" id="modalInput"
                style="width:100%; padding:10px; border-radius:8px; border:1px solid #ddd; margin-bottom: 20px;">
            <div style="display:flex; gap:10px; justify-content:flex-end;">
                <button onclick="document.getElementById('saveModal').style.display='none'" class="btn"
                    style="width:auto; padding: 8px 20px; background:#f3f4f6;">ยกเลิก</button>
                <button onclick="confirmSaveHistory()" class="btn btn-primary"
                    style="width:auto; padding: 8px 20px;">ตกลง</button>
            </div>
        </div>
    </div>

    <div id="loadModal" class="modal-overlay">
        <div class="custom-modal">
            <h3 style="margin-bottom: 15px;">📂 โหลดข้อมูลเก่า</h3>
            <p id="loadModalText" style="margin-bottom: 20px;"></p>
            <div style="display:flex; gap:10px; justify-content:flex-end;">
                <button onclick="document.getElementById('loadModal').style.display='none'" class="btn"
                    style="width:auto; padding: 8px 20px; background:#f3f4f6;">ยกเลิก</button>
                <button id="confirmLoadBtn" class="btn btn-primary"
                    style="width:auto; padding: 8px 20px;">แก้ไขข้อมูลนี้</button>
            </div>
        </div>
    </div>

    <div class="history-sidebar no-print">
        <div class="sidebar-header">
            <div class="sidebar-title">📋 ฟอร์มที่เลือก</div>
            <select id="fmtSelector" onchange="switchFMT(this.value)"
                style="width: 100%; padding: 8px; margin-top: 10px; border-radius: 8px; border: 1px solid var(--border); font-family: var(--font-main);">
                <option value="02">FMT-02 (ฉีดโฟมประจำวัน)</option>
                <option value="37">FMT-37 (ระบบสารสนเทศ)</option>

            </select>
        </div>
        <div class="sidebar-header">
            <div class="sidebar-title">📋 ประวัติการตรวจเช็ค</div>
            <div style="font-size: 0.75rem; color: var(--text-sub); margin-top: 5px;">ฝ่าย / แผนก ซ่อมบำรุง</div>
        </div>
        <div class="sidebar-actions">
            <input type="checkbox" id="selectAll" onclick="toggleSelectAll(this)" style="cursor: pointer;">
            <label for="selectAll" style="cursor: pointer; font-weight: 600;">เลือกทั้งหมด</label>
            <button onclick="syncFromCloud()"
                style="margin-left: auto; border: none; background: none; cursor: pointer; color: var(--primary);"
                title="ดึงข้อมูลจาก Cloud">
                ☁️ Sync
            </button>
        </div>
        <div class="sidebar-content" id="history-list">
            <!-- Items injected here -->
        </div>
    </div>

    <div class="controls no-print">
        <div id="statusBadge"
            style="padding: 8px; background: #fee2e2; color: #991b1b; font-size: 0.75rem; text-align: center; border-radius: 8px; margin-bottom: 10px; display: none; font-weight: bold; border: 1px solid #fecaca;">
            👀 Viewing History</div>

        <button id="editToggleBtn" class="btn" onclick="toggleEditMode()"
            style="display: none; background: #3b82f6; color: white;"><span>✏️ แก้ไขข้อมูลนี้</span></button>
        <button id="updateBtn" class="btn" onclick="updateCurrentHistory()"
            style="display: none; background: var(--warning); color: white;"><span>🔄 อัปเดตข้อมูลเดิม</span></button>
        <button class="btn btn-primary" onclick="saveToHistory()"><span>💾 บันทึกใหม่</span></button>

        <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 8px;">
            <button class="btn btn-success" onclick="markAllNormal()"
                style="font-size: 0.75rem; padding: 10px 5px;"><span>✅ ติ๊กผ่านทั้งหมด</span></button>
            <button class="btn btn-danger" onclick="clearAll()" style="font-size: 0.75rem; padding: 10px 5px;"><span>🗑️
                    ล้างทั้งหมด</span></button>
        </div>

        <hr style="margin: 15px 0; border: 0; border-top: 1px solid var(--border);">

        <button class="btn btn-primary" onclick="printSelected()" id="printSelectedBtn"
            style="background: #000; display: none;">
            <span>🖨️ พิมพ์รายการที่เลือก</span>
        </button>

        <button class="btn btn-outline" onclick="window.print()">
            <span>🖨️ พิมพ์หน้าปัจจุบัน</span>
        </button>
        <div class="drag-handle-bar">•••</div>
    </div>

    <div id="print-area"></div>


    <div id="forms-container"></div>

    <script>
        let currentFMT = 2;
        let currentLoadedId = null;
        let pendingLoadItem = null;

        // Drag-to-fill variables
        let isDragging = false;
        let dragStartState = 0;
        let dragStartCell = null;

        // Helper functions for Thai dates (Buddhist Era)
        const thaiMonths = [
            'มกราคม', 'กุมภาพันธ์', 'มีนาคม', 'เมษายน', 'พฤษภาคม', 'มิถุนายน',
            'กรกฎาคม', 'สิงหาคม', 'กันยายน', 'ตุลาคม', 'พฤศจิกายน', 'ธันวาคม'
        ];

        function toBuddhistYear(year) {
            return parseInt(year) + 543;
        }

        function formatThaiDate(dateStr) {
            if (!dateStr) return '';
            const date = new Date(dateStr);
            const day = date.getDate();
            const month = date.getMonth() + 1;
            const year = toBuddhistYear(date.getFullYear());
            return `${day}/${month}/${year}`;
        }

        function toThaiDateStr(dateStr) {
            return formatThaiDate(dateStr);
        }

        function getCurrentThaiYear() {
            return toBuddhistYear(new Date().getFullYear());
        }

        const checklistData37 = [
            {
                category: "คอมพิวเตอร์และอุปกรณ์พ่วง (Computer & Peripherals)",
                items: [
                    { name: "1. หน้าจอ (Monitor)", std: "สะอาด, ไม่แตกร้าว, ภาพคมชัดไม่มีเส้น" },
                    { name: "2. ตัวเครื่อง (Case/CPU)", std: "สะอาด, พัดลมหมุนปกติ, ไม่มีเสียงดังผิดปกติ" },
                    { name: "3. แป้นพิมพ์และเมาส์", std: "สะอาด, ใช้งานได้ครบทุกปุ่ม, ไม่ค้าง" },
                    { name: "4. สายไฟและปลั๊ก (Power Cord)", std: "สภาพสมบูรณ์ไม่ฉีกขาด, เสียบแน่น, ความร้อนปกติ" },
                    { name: "5. สาย LAN (LAN Cable)", std: "สภาพสมบูรณ์, หัวต่อไม่แตก, เสียบแน่น" },
                    { name: "6. ป้ายชื่อเครื่อง (Machine ID)", std: "สะอาด, ชัดเจน, ติดแน่น" }
                ]
            },
            {
                category: "เครื่องพิมพ์และสแกนเนอร์ (Printer & Scanner)",
                items: [
                    { name: "7. ถาดกระดาษและลูกกลิ้ง", std: "สะอาด, ไม่มีสิ่งแปลกปลอม, กระดาษไม่ติด" },
                    { name: "8. ตลับหมึกและงานพิมพ์", std: "ปริมาณเพียงพอ, งานพิมพ์ชัดเจนไม่มีรอยเปื้อน" },
                    { name: "9. กระจกสแกนเนอร์", std: "สะอาด, ไม่มีรอยขีดข่วนหรือคราบ" }
                ]
            },
            {
                category: "เครื่องสำรองไฟ (UPS)",
                items: [
                    { name: "10. สถานะไฟและเสียง (Status)", std: "ไฟเขียวปกติ, ไม่มีเสียงเตือนผิดปกติ" },
                    { name: "11. สภาพตัวเครื่องและแบตเตอรี่", std: "ไม่บวม, ไม่มีความร้อนสูง, สายเสียบแน่น" }
                ]
            },
            {
                category: "สภาพแวดล้อม (Environmental)",
                items: [
                    { name: "12. ความสะอาดและระเบียบ", std: "จัดระเบียบสายไฟเรียบร้อย, อากาศถ่ายเทดี" }
                ]
            }
        ];

        const checklistData02 = [
            {
                category: "ระบบ SAFETY",
                items: [
                    { name: "ประตูเปิด-ปิด ซ้าย-ขวา", std: "เปิด-ปิด ได้สะดวก" },
                    { name: "Limit switch ซ้าย-ขวา", std: "เปิดเครื่องหยุด - ปิดเครื่องเดิน" },
                    { name: "ตัวล็อค ประตูซ้าย-ขวา", std: "ล็อคประตูได้แน่น" },
                    { name: "EMERGENCY STOP", std: "กดแล้วเครื่องหยุด" }
                ]
            },
            {
                category: "ระบบไฟฟ้า",

        function toggle(cell) {
            if (!isDragging) {
                setCellState(cell, (parseInt(cell.dataset.state) + 1) % 4);
            }
        }

        function setCellState(cell, state) {
            cell.dataset.state = state;
            cell.classList.remove('status-ok', 'status-bad', 'status-na');
            if (state === 1) { cell.textContent = "/"; cell.classList.add('status-ok'); }
            else if (state === 2) { cell.textContent = "X"; cell.classList.add('status-bad'); }
            else { cell.textContent = ""; }
        }

        // Drag-to-fill handlers
        document.addEventListener('mousedown', (e) => {
            if (e.target.classList.contains('check-cell')) {
                isDragging = true;
                dragStartCell = e.target;
                dragStartState = (parseInt(e.target.dataset.state) + 1) % 4;
                setCellState(e.target, dragStartState);
                e.preventDefault();
            }
        });

        document.addEventListener('mousemove', (e) => {
            if (isDragging && e.target.classList.contains('check-cell')) {
                setCellState(e.target, dragStartState);
            }
        });

        document.addEventListener('mouseup', () => {
            isDragging = false;
            dragStartCell = null;
        });

        function toggleColumn(num) {
            const cells = document.querySelectorAll(`.mach-${num}`);
            if (!cells.length) return;
            let nextState = (parseInt(cells[0].dataset.state) + 1) % 4;
            cells.forEach(cell => setCellState(cell, nextState));
        }

        function confirmSaveHistory() {
            const label = document.getElementById('modalInput').value.trim();
            if (!label) return alert("กรุณาระบุชื่อ");

            const cellStates = Array.from(document.querySelectorAll('.check-cell')).map(c => ({ num: c.dataset.num, state: c.dataset.state }));
            const rowRemarks = Array.from(document.querySelectorAll('.row-remark')).map(el => el.textContent);
            const remarks = Array.from(document.querySelectorAll('.correction-input')).map(el => el.textContent);
            const sigDates = Array.from(document.querySelectorAll('.date-input')).map(el => el.value);
            const sigNames = Array.from(document.querySelectorAll('.sig-name')).map(el => el.textContent);

            let metadata = {};
            if (currentFMT === 2) {
                const monthSelect = document.querySelector('.fmt02-month-select');
                const yearSelect = document.querySelector('.fmt02-year-select');
                const monthText = monthSelect && monthSelect.value ? thaiMonths[parseInt(monthSelect.value) - 1] + ' ' + yearSelect.value : '';

                metadata = {
                    mNo: document.querySelector('.fmt02-m-no')?.textContent || '',
                    month: monthText,
                    area: document.querySelector('.fmt02-area')?.textContent || '',
                    dept: document.querySelector('.fmt02-dept')?.textContent || ''
                };
            }

            const entry = {
                id: Date.now(),
                fmt: currentFMT,
                label,
                timestamp: new Date().toLocaleString('th-TH'),
                data: cellStates,
                rowRemarks,
                remarks,
                sigDates,
                sigNames,
                metadata
            };
            let history = JSON.parse(localStorage.getItem('fmt_history') || '[]');
            history.unshift(entry);
            localStorage.setItem('fmt_history', JSON.stringify(history));

            // Prepare data for Google Sheet (Flat Format)
            const checksArr = cellStates.map(c => parseInt(c.state));
            const sheetData = {
                id: entry.id,
                fmt: entry.fmt,
                date: new Date().toLocaleDateString('th-TH'),
                inspector: entry.label,
                checks: checksArr,
                corrections: remarks,
                dates: sigDates,
                rowRemarks: rowRemarks,
                jobName: entry.label,
                metadata: entry.metadata
            };
            sendToGoogleSheet(sheetData);

            document.getElementById('saveModal').style.display = 'none';
            renderHistoryList();
        }

            if (checkedCount > 0) {

        function printSelected() {
            const checkedIds = Array.from(document.querySelectorAll('.item-checkbox:checked')).map(cb => parseInt(cb.dataset.id));
            if (checkedIds.length === 0) return;

            const history = JSON.parse(localStorage.getItem('fmt_history') || '[]');
            const selectedItems = history.filter(h => checkedIds.includes(h.id));

            const printArea = document.getElementById('print-area');
            printArea.innerHTML = '';

            selectedItems.forEach(item => {
                const formHTML = generateFormHTMLFromData(item);
                printArea.innerHTML += formHTML;
            });

            window.print();
            printArea.innerHTML = '';
        }

        function generateFormHTMLFromData(item) {
            if (item.fmt === 2) return renderStaticForm02(item);
            return renderStaticForm37(item);
        }

        function renderStaticForm37(item) {
            let fullHTML = '';
            const ranges = [1, 21, 41];

            ranges.forEach(start => {
                let machineHeaders = '';
                for (let i = 0; i < 20; i++) {
                    let num = start + i;
                    machineHeaders += `<th style="width: 28px; text-align: center;">${num <= 54 ? num : ''}</th>`;
                }

                let rowsHtml = '';
                let cellIndexOffset = 0;
                if (start == 21) cellIndexOffset = checklistData.reduce((a, g) => a + g.items.length, 0) * 20;
                if (start == 41) cellIndexOffset = checklistData.reduce((a, g) => a + g.items.length, 0) * 40;

                let localCellCounter = 0;
                checklistData.forEach(group => {
                    group.items.forEach((chkItem, idx) => {
                        const itemsCount = checklistData.reduce((a, g) => a + g.items.length, 0);
                        const rowIdxInGroup = checklistData.flatMap(g => g.items).indexOf(chkItem);

        async function syncFromCloud() {
            const btn = document.querySelector('button[title="ดึงข้อมูลจาก Cloud"]');
            if (btn) {
                btn.innerHTML = '⏳...';
                btn.disabled = true;
            }

            try {
                // Assuming the Script returns a JSON list of objects
                const response = await fetch(GOOGLE_SCRIPT_URL);
                if (!response.ok) throw new Error("Network response was not ok");
                const cloudData = await response.json();

                if (!Array.isArray(cloudData)) throw new Error("Invalid data format");

                let localHistory = JSON.parse(localStorage.getItem('fmt_history') || '[]');
                let newCount = 0;

                cloudData.forEach(cItem => {
                    // Check if exists
                    if (!localHistory.some(h => h.id == cItem.id)) {
                        try {
                            // Convert format
                            const appItem = {
                                id: parseInt(cItem.id) || Date.now(),
                                fmt: parseInt(cItem.fmt) || 2, // Default to 2 if missing
                                label: cItem.jobName || cItem.inspector || "No Name",
                                timestamp: cItem.date || new Date().toLocaleString('th-TH'),
                                data: (cItem.checks || []).map(s => ({ state: s })),
                                rowRemarks: cItem.rowRemarks || [],
                                remarks: cItem.corrections || [],
                                sigDates: cItem.dates || [],
                                sigNames: [], // Sheet might not have this, leave empty
                                metadata: cItem.metadata || {}
                            };
                            localHistory.push(appItem);
                            newCount++;
                        } catch (e) {
                            console.error("Error parsing item:", cItem, e);
                        }
                    }
                });

                if (newCount > 0) {
                    // Sort descending by id (timestamp)
                    localHistory.sort((a, b) => b.id - a.id);
                    localStorage.setItem('fmt_history', JSON.stringify(localHistory));
                    renderHistoryList();
                    alert(`✅ ดึงข้อมูลสำเร็จ: เพิ่ม ${newCount} รายการใหม่`);
                } else {
                    alert("ข้อมูลเป็นปัจจุบันแล้ว");
                }

            } catch (err) {
                console.error(err);
                alert("❌ เกิดข้อผิดพลาดในการดึงข้อมูล: " + err.message);
            } finally {
                if (btn) {
                    btn.innerHTML = '☁️ Sync';
                    btn.disabled = false;
                }
            }
        }

                dates: dates,
                jobName: document.getElementById('jobName') ? document.getElementById('jobName').value : "",
                location: document.getElementById('location') ? document.getElementById('location').value : ""
            };

            // บันทึกลง LocalStorage (เพื่อดู History ฝั่งซ้าย)
            let history = JSON.parse(localStorage.getItem('fmt_history') || '[]');
            if (currentLoadedId) {
                const index = history.findIndex(h => h.id === currentLoadedId);
                if (index !== -1) history[index] = data;
            } else {
                history.unshift(data);
            }
            localStorage.setItem('fmt_history', JSON.stringify(history));

            // อัปเดต UI
            renderHistoryList();

            // --- ส่งข้อมูลไป Google Sheet ---
            sendToGoogleSheet(data);
        }

        // แก้ไขฟังก์ชัน updateHistory (ปุ่มอัปเดต)
        function updateHistory() {
            if (!currentLoadedId) return;
            saveLocally();
        }

        // Draggable Controls
        const controls = document.querySelector('.controls');
        let isDraggingControls = false;
        let dragOffsetX = 0;
        let dragOffsetY = 0;

        controls.addEventListener('mousedown', (e) => {
            if (!e.target.closest('.drag-handle-bar')) return;

            isDraggingControls = true;

            const rect = controls.getBoundingClientRect();
            dragOffsetX = e.clientX - rect.left;
            dragOffsetY = e.clientY - rect.top;

            controls.style.right = 'auto'; // Disable 'right' so 'left' takes over
            controls.style.left = rect.left + 'px';
            controls.style.top = rect.top + 'px';
        });

        document.addEventListener('mousemove', (e) => {
            if (!isDraggingControls) return;
            e.preventDefault();

            const x = e.clientX - dragOffsetX;
            const y = e.clientY - dragOffsetY;

            const maxX = window.innerWidth - controls.offsetWidth;
            const maxY = window.innerHeight - controls.offsetHeight;

            controls.style.left = Math.max(0, Math.min(x, maxX)) + 'px';
            controls.style.top = Math.max(0, Math.min(y, maxY)) + 'px';
        });

        document.addEventListener('mouseup', () => {
            isDraggingControls = false;
        });

        // Touch support for mobile
        controls.addEventListener('touchstart', (e) => {
            if (!e.target.closest('.drag-handle-bar')) return;

            isDraggingControls = true;
            const touch = e.touches[0];
            const rect = controls.getBoundingClientRect();
            dragOffsetX = touch.clientX - rect.left;
            dragOffsetY = touch.clientY - rect.top;

            controls.style.right = 'auto';
            controls.style.left = rect.left + 'px';
            controls.style.top = rect.top + 'px';
        }, { passive: false });

        document.addEventListener('touchmove', (e) => {
            if (!isDraggingControls) return;
            const touch = e.touches[0];

            // Check if touch is on handle to decide prevention strictly?
            // Actually, keep preventDefault only if dragging to avoid scrolling while moving the modal
            if (e.cancelable) e.preventDefault();

            const x = touch.clientX - dragOffsetX;
            const y = touch.clientY - dragOffsetY;

            const maxX = window.innerWidth - controls.offsetWidth;
            const maxY = window.innerHeight - controls.offsetHeight;

            controls.style.left = Math.max(0, Math.min(x, maxX)) + 'px';
            controls.style.top = Math.max(0, Math.min(y, maxY)) + 'px';
        }, { passive: false });

        document.addEventListener('touchend', () => {
            isDraggingControls = false;
        });

    </script>

</body>


</html>
